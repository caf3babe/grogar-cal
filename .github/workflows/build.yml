name: Build calendar

on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st of every month
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # for the keepalive step below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # If the source site changed and the build fails, nothing is deployed
      # and the previous calendars stay online.
      - run: python3 build.py public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # GitHub disables scheduled workflows after 60 days without repo
      # activity; re-enabling the workflow resets that timer.
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
